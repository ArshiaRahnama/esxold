            <svg class="circle" id="stamina" width="60" height="60" style="display: none;">

        <div id="tradeDOM"></div>
        <div id="skillDOM"></div>
        <div id="logoDOM">
          <img id="logo" src="./logo/logo.png" style="width: 2%; margin-top: 0.0%; margin-left: 94.5%;"/>
        </div>
        <!-- seatbelt (از carhud ادغام شد) -->
        <div id="seatbeltContainer">
          <header>
            <img src="./seatbelt/seatbelt.png" class="blink-image" alt="seatbelt">
          </header>
        </div>
        <!-- street label (از sun-streetlabel ادغام شد) -->
        <div id="streetlabelContainer">
          <div id="tnew">
            <span class="white">Time : <span id="timestamp" class="yellow"></span> <span id="sd" class="white"> | </span> <span id="timestamp2" class="white"></span> <span id="src" style="color:rgb(0, 255, 0)"></span> <span id="server" class="white"></span> </span>
          </div>
          <div id="sl" style="display: none;">
            <section>
              <span class="directionHolder">|<h4 id="direction"></h4>|</span>
              <div class="addressHolder">
                <p id="zone" class="yellow"></p>
                <p id="street" class="white"></p>
              </div>
            </section>
          </div>
        </div>
        <!-- achievements (UI سفارشی خودم) حذف شد؛ برگشتیم به باندل اصلی #skillDOM -->
        <div id="toastContainer"></div>
        <!-- leaderboard -->
        <div id="lbFloatButton" title="Leaderboard">🏆</div>
        <div id="leaderboardContainer">
          <div class="lbWindow">
            <div class="lbHeader">
              <div class="lbTitle">🏆 Leaderboard</div>
              <div class="lbClose" id="lbClose">✕</div>
            </div>
            <div class="lbTabs">
              <button class="lbTab active" data-mode="score">ACHIEVEMENTS</button>
              <button class="lbTab" data-mode="playtime">PLAY TIME</button>
              <button class="lbTab" data-mode="skill">SKILL %</button>
            </div>
            <div class="lbSkillRow" id="lbSkillRow" style="display:none;"></div>
            <div class="lbList" id="lbList"></div>
          </div>
        </div>
        <!-- carhud -->
        <div id="carhudContainer">
          <div class="chWrap">
            <div class="chSpeedBlock">
              <div class="chSpeedNum" id="chSpeedNum">0</div>
              <div class="chSpeedUnit" id="chSpeedUnit">KMH</div>
            </div>
            <div class="chMid">
              <div class="chBarRow">
                <div class="chBarLabel">RPM</div>
                <div class="chBarTrack"><div class="chBarFill rpm" id="chRpmFill" style="width:0%;"></div></div>
              </div>
              <div class="chBarRow" id="chFuelRow">
                <div class="chBarLabel">FUEL</div>
                <div class="chBarTrack"><div class="chBarFill fuel" id="chFuelFill" style="width:0%;"></div></div>
              </div>
            </div>
          </div>
