<!DOCTYPE html>
<html lang="fa">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="stylesheet" href="styles/quest.css" />
  <link rel="stylesheet" href="styles/fonts.css" />
  <link rel="stylesheet" href="styles/admin.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body>
  <div class="container">
    <div class="hud-frame">
      <div class="hud-glow hud-glow-a"></div>
      <div class="hud-glow hud-glow-b"></div>

      <div class="sidebar">
        <div class="brand">
          <i class="fa-solid fa-satellite-dish"></i>
        </div>

        <div class="menu-item active" id="personal-info">
          <i class="fa-solid fa-user icon"></i>
          <span class="label">Dossier</span>
        </div>
        <div class="menu-item" id="quest">
          <i class="fa-solid fa-person-circle-question icon"></i>
          <span class="label">Case Files</span>
        </div>
        <div class="menu-item" id="admin">
          <i class="fa-solid fa-user-shield icon"></i>
          <span class="label">Dispatch</span>
        </div>

        <div class="sidebar-footer">ID // TERMINAL</div>
      </div>

      <div class="panels">
        <!-- Personal Info -->
        <div class="main-content">
          <div class="panel-header">
            <div class="panel-eyebrow">ACCESS &middot; PERSONNEL FILE</div>
            <div class="panel-header-row">
              <h1><i class="fa-solid fa-id-card"></i> Information</h1>
              <button class="adminDuty" id="adminDuty">Off Duty</button>
            </div>
          </div>

          <div class="profile-card">
            <div class="rank-badge">
              <div class="rank-badge-core">
                <span class="level-number">0</span>
                <span class="rank-badge-label">LVL</span>
              </div>
            </div>

            <div class="profile-details">
              <p class="name"><i class="fa-solid fa-user"></i><span class="detail-label">Name</span><span class="name_span">Loading...</span></p>
              <p class="job"><i class="fa-solid fa-house-laptop"></i><span class="detail-label">Job</span><span class="job_span">Loading...</span></p>
              <p class="gang"><i class="fa-solid fa-people-roof"></i><span class="detail-label">Gang</span><span class="gang_span">Loading...</span></p>
            </div>
          </div>

          <div class="stats-row">
            <div class="stat-card">
              <i class="fa-solid fa-money-bill"></i>
              <div class="stat-text">
                <span class="stat-label">Cash</span>
                <span class="cash_span stat-value">Loading...</span>
              </div>
            </div>
            <div class="stat-card">
              <i class="fa-solid fa-landmark"></i>
              <div class="stat-text">
                <span class="stat-label">Bank</span>
                <span class="bank_span stat-value">Loading...</span>
              </div>
            </div>
            <div class="stat-card">
              <i class="fa-solid fa-coins"></i>
              <div class="stat-text">
                <span class="stat-label">Coin</span>
                <span class="coin_span stat-value">Loading...</span>
              </div>
            </div>
          </div>

          <div class="level-info">
            <div class="level-info-head">
              <span><i class="fa-solid fa-bolt"></i> Progress To Next Level</span>
            </div>
            <div class="xp-bar">
              <div class="xp-fill" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Quest -->
        <div class="quests">
          <div class="panel-header">
            <div class="panel-eyebrow">ACTIVE &middot; CASE FILES</div>
            <h1><i class="fa-solid fa-list-check"></i> Quests</h1>
          </div>
          <div class="quests-grid"></div>
        </div>

        <!-- Admin Menu -->
        <div class="adminMenu">
          <div class="player-list">
            <div class="panel-header">
              <div class="panel-eyebrow">DISPATCH &middot; ROSTER</div>
              <h1><i class="fa-solid fa-users"></i> Player List</h1>
            </div>
            <div class="players-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/script.js"></script>
  <script src="scripts/quest.js"></script>
  <script src="scripts/personal.js"></script>
  <script src="scripts/admin.js"></script>
</body>
</html>
