<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Unique ClotheShop</title>

    <!-- CSS -->
    <link rel='stylesheet' href='https://pro.fontawesome.com/releases/v5.12.0/css/all.css'>
    <link rel="stylesheet" href="style.css">

    <!-- JS: use the game's built-in jquery (bundled with the NUI browser,
         no external/CDN dependency, so the shop still works even if the
         client has no internet access at all) -->
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="app.js"></script>
</head>
<body>
    <div class="container">

        <div class="modal">
            <div class="modalimage"></div>
            <div class="modal-info"></div>
            <div class="btn-open"></div>
        </div>

        <div class="shop">
            <p class="shopName">Clothe Shop</p>
            <div class="items"></div>
        </div>

    </div>
</body>
</html>
