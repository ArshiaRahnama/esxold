<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>DOJ Case Board</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="board" class="hidden">

	<div id="topbar">
		<div class="topbar-title">
			<span class="badge-icon">&#9878;</span>
			<span id="topbarLabel">DOJ // Parvande Haye Baz</span>
			<span id="liveDot" class="live-dot"></span>
		</div>
		<div class="topbar-tabs">
			<button id="tabCases" class="tab-btn active">Parvande Ha</button>
			<button id="tabWanted" class="tab-btn">Takhte Taghib</button>
			<button id="tabBolo" class="tab-btn">BOLO Ha</button>
		</div>
		<button id="closeBtn" class="close-btn">&times;</button>
	</div>

	<div id="body">

		<!-- CASES VIEW -->
		<div id="viewCases" class="view active">
			<div id="caseList" class="sidebar"></div>

			<div id="caseDetail" class="detail">
				<div id="emptyState" class="empty-state">
					<div class="empty-icon">&#128193;</div>
					<div>Yek Parvande Ra Az List Entekhab Konid</div>
				</div>

				<div id="caseContent" class="hidden">
					<div class="detail-header">
						<div>
							<div id="caseTitle" class="detail-title"></div>
							<div id="caseStatus" class="status-pill"></div>
						</div>
					</div>

					<div class="section">
						<div class="section-title">Madarek</div>
						<div id="evidenceList" class="card-grid"></div>
					</div>

					<div class="section">
						<div class="section-title">Yaddasht Ha</div>
						<div id="notesList" class="notes-list"></div>
						<div class="note-input-row">
							<textarea id="noteInput" placeholder="Yaddashte Jadid..."></textarea>
							<button id="addNoteBtn" class="btn btn-outline">Sabt</button>
						</div>
					</div>

					<div class="section actions-section">
						<div class="section-title">Eghdamat</div>
						<div id="referButtons" class="action-row"></div>
						<div id="matchRow" class="action-row"></div>
						<div id="closeRow" class="action-row"></div>
					</div>
				</div>
			</div>
		</div>

		<!-- WANTED VIEW -->
		<div id="viewWanted" class="view">
			<div class="wanted-header">
				<div class="section-title">Kodhaye Sarnakh Takrari</div>
				<div class="wanted-sub">Har Chi Adad Bishtar, Ehtemale Yek Mozaneh Sabet Bishtare</div>
			</div>
			<div id="wantedList" class="wanted-grid"></div>
		</div>

		<!-- BOLO VIEW -->
		<div id="viewBolo" class="view">
			<div class="bolo-header">
				<div class="siren-strip"></div>
				<div class="bolo-header-text">
					<div class="section-title">BOLO Haye Faal</div>
					<div class="wanted-sub">Pelak Haye Sadereh Az Parvande Haye DOJ</div>
				</div>
			</div>

			<div class="bolo-check-row">
				<button id="checkVehicleBtn" class="btn btn-primary">&#128269; Barresi Nazdiktarin Khodro</button>
				<div id="plateResult" class="plate-result hidden"></div>
			</div>

			<div id="boloList" class="bolo-grid"></div>
		</div>

	</div>
</div>

<script src="script.js"></script>
</body>
</html>
