<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speedometer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="speedo" class="speedo-hidden">
    <div class="speedo-main">
      <span id="speedo-value">0</span>
      <span class="speedo-unit">KM/H</span>
    </div>
    <div class="speedo-sub">
      <div class="speedo-item">
        <span class="speedo-label">دنده</span>
        <span id="speedo-gear">N</span>
      </div>
      <div class="speedo-item speedo-bar-item">
        <span class="speedo-label">بنزین</span>
        <div class="speedo-bar-track">
          <div id="speedo-fuel-bar" class="speedo-bar-fill speedo-bar-fuel" style="width:100%"></div>
        </div>
      </div>
      <div class="speedo-item speedo-bar-item">
        <span class="speedo-label">موتور</span>
        <div class="speedo-bar-track">
          <div id="speedo-engine-bar" class="speedo-bar-fill speedo-bar-engine" style="width:100%"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
